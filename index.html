<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RMSI News Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1a2b;--surface:#14233a;--text:#eef2f7;--muted:#93a3ba;--line:#26385a;
--weather:#5eb0ff;--conflict:#ff6b6b;--security:#ffa94d;--contingency:#ffd166;--film:#c9a0ff;--live:#3dd6e0;--motorsport:#ff8fc7;
--head:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5f9;--surface:#fff;--text:#14202f;--muted:#5a6a82;--line:#d6dde8;--weather:#1f7ae0;--conflict:#d6333a;--security:#c2640a;--contingency:#a87a00;--film:#7b3fd1;--live:#0b8a96;--motorsport:#c7367f;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0e1a2b;--surface:#14233a;--text:#eef2f7;--muted:#93a3ba;--line:#26385a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:3vh 3.2vw 1.8vh}
.brand h1{font:700 clamp(22px,3vw,48px)/1 var(--head);margin:0;letter-spacing:.01em}
.brand p{margin:.7vh 0 0;color:var(--muted);font-size:clamp(12px,1.3vw,22px)}
.clock{text-align:right}
.clock b{display:block;font:600 clamp(24px,3.4vw,56px)/1 var(--head);font-variant-numeric:tabular-nums}
.clock span{color:var(--muted);font-size:clamp(12px,1.3vw,22px)}
.live{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:#4ade80;margin-right:.5em;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.cats{display:flex;flex-wrap:wrap;gap:.8vh 2.2vw;padding:0 3.2vw 2vh;margin:0 3.2vw;padding-left:0;padding-right:0;border-bottom:1px solid var(--line)}
.cat{display:flex;align-items:center;gap:.55em;font-size:clamp(11px,1.2vw,20px);color:var(--muted)}
.cat i{width:.7em;height:.7em;background:var(--c);border-radius:1px}
.cat b{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.cat.zero{opacity:.4}
.cap{font-size:clamp(11px,1.2vw,20px);color:var(--muted);padding-right:1.2vw;border-right:1px solid var(--line)}
main{flex:1;display:grid;grid-template-columns:1.6fr 1fr;gap:3vw;padding:3vh 3.2vw 3.5vh;min-height:0}
.lead{position:relative;display:flex;flex-direction:column;justify-content:center;padding:0 0 4vh 3vw;border-left:.7vw solid var(--c,var(--weather));transition:opacity .5s}
.lead.fade{opacity:0}
.kind{font:600 clamp(16px,2vw,34px)/1 var(--head);color:var(--c)}
.lead h2{font:600 clamp(30px,4.8vw,84px)/1.08 var(--head);margin:2.4vh 0 3vh;text-wrap:balance}
.meta{display:flex;gap:2vw;flex-wrap:wrap;color:var(--muted);font-size:clamp(14px,1.7vw,28px)}
.meta strong{color:var(--text);font-weight:500}
.prog{position:absolute;left:3vw;right:0;bottom:0;height:3px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--c)}
.prog i.run{animation:fill var(--rot,12s) linear forwards}
@keyframes fill{to{width:100%}}
.pos{position:absolute;right:0;bottom:1.4vh;color:var(--muted);font-size:clamp(11px,1.2vw,20px);font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;min-height:0}
.side h3{font:600 clamp(14px,1.5vw,24px)/1 var(--head);color:var(--muted);margin:0 0 1.2vh;letter-spacing:.04em}
.roll{flex:1;overflow:hidden;mask-image:linear-gradient(transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 6%,#000 94%,transparent)}
.track{animation:roll var(--dur,120s) linear infinite}
@keyframes roll{to{transform:translateY(-50%)}}
.row{display:grid;grid-template-columns:.45vw 1fr;gap:1.2vw;padding:1.5vh 0;border-bottom:1px solid var(--line)}
.row .bar{background:var(--c);border-radius:1px}
.row .k{font:600 clamp(11px,1.15vw,19px)/1 var(--head);color:var(--c);margin-bottom:.7vh}
.row p{margin:0;font:500 clamp(15px,1.8vw,30px)/1.22 var(--head)}
.row small{display:block;margin-top:.7vh;color:var(--muted);font-size:clamp(11px,1.2vw,20px)}
@media (max-width:800px){main{grid-template-columns:1fr}.side{display:none}}
@media (prefers-reduced-motion:reduce){.track,.live{animation:none}.prog i.run{animation-duration:.01s}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>RMSI News Feed</h1><p>Live risk monitor</p></div>
  <div class="clock"><b id="time"></b><span><i class="live"></i><span id="date"></span></span></div>
</header>
<div class="cats" id="cats"></div>
<main>
  <section class="lead" id="lead"></section>
  <section class="side"><h3>Latest</h3><div class="roll"><div class="track" id="track"></div></div></section>
</main>
<script>
// Sample headlines, replaced automatically when feed.json is available.
const SAMPLE=[
 {cat:"weather",title:"Sample: wildfire evacuations ordered as strong winds fan flames",source:"GDACS",place:"Southern Europe",time:"20 min ago"},
 {cat:"conflict",title:"Sample: missile strike reported near port as ceasefire talks stall",source:"BBC World",place:"World",time:"35 min ago"},
 {cat:"security",title:"Sample: police investigate explosion at city centre market",source:"Al Jazeera",place:"World",time:"1 hr ago"},
 {cat:"contingency",title:"Sample: arena tour postponed after headline act cancels due to illness",source:"Google News",place:"Events",time:"1 hr ago"},
 {cat:"film",title:"Sample: production halted on streaming series after stunt injury",source:"Deadline",place:"Film & TV",time:"2 hr ago"},
 {cat:"contingency",title:"Sample: festival cancelled after severe storm warning",source:"IQ Magazine",place:"Live music",time:"3 hr ago"},
 {cat:"live",title:"Sample: nightclub licence revoked following crowd crush",source:"Access All Areas",place:"Live music",time:"4 hr ago"},
 {cat:"motorsport",title:"Sample: red flag after heavy crash in opening practice",source:"Autosport",place:"Motorsport",time:"5 hr ago"}
];
const ALIAS={festival:"contingency",venue:"live"};
{const t=new URLSearchParams(location.search).get("theme");if(t==="dark")document.documentElement.dataset.theme="dark"}
const FEED_URL="feed.json", ROT=12000;
const CATS=[["weather","Weather / Nat Cat"],["conflict","Conflict"],["security","Terror & Unrest"],["contingency","Contingency"],["film","Film & TV"],["live","Live"],["motorsport","Motorsport"]];
const LAB=Object.fromEntries(CATS);
const col=k=>LAB[k]?`var(--${k})`:"var(--weather)";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let items=SAMPLE,idx=0,timer;
async function load(){
  try{const r=await fetch(FEED_URL,{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();if(Array.isArray(d)&&d.length)items=d.map(i=>({...i,cat:ALIAS[i.cat]||i.cat}))}catch(e){}
  draw();
}
function draw(){
  document.getElementById("cats").innerHTML='<span class="cap">Last 24 hours</span>'+CATS.map(([k,n])=>{const day=Date.now()-864e5,c=items.filter(i=>i.cat===k&&(!i.published||new Date(i.published)>day)).length;return `<span class="cat${c?"":" zero"}" style="--c:${col(k)}"><i></i>${n} <b>${c}</b></span>`}).join("");
  const row=i=>`<div class="row" style="--c:${col(i.cat)}"><div class="bar"></div><div><div class="k">${LAB[i.cat]||""}</div><p>${esc(i.title)}</p><small>${esc(i.source)}&nbsp;&nbsp;${esc(i.time)}</small></div></div>`;
  const h=items.map(row).join(""),t=document.getElementById("track");
  t.innerHTML=h+h;t.style.setProperty("--dur",Math.max(40,items.length*9)+"s");
  if(!timer){show();timer=setInterval(show,ROT)}
}
function show(){
  const f=document.getElementById("lead"),i=items[idx%items.length],n=items.length;
  f.classList.add("fade");
  setTimeout(()=>{
    f.style.setProperty("--c",col(i.cat));f.style.setProperty("--rot",ROT/1000+"s");
    f.innerHTML=`<div class="kind">${LAB[i.cat]||""}</div><h2>${esc(i.title)}</h2><div class="meta"><strong>${esc(i.source)}</strong><span>${esc(i.place)}</span><span>${esc(i.time)}</span></div><div class="pos">${idx%n+1} of ${n}</div><div class="prog"><i></i></div>`;
    const p=f.querySelector(".prog i");void p.offsetWidth;p.classList.add("run");
    f.classList.remove("fade");idx++;
  },500);
}
function tick(){const d=new Date();document.getElementById("time").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});document.getElementById("date").textContent=d.toLocaleDateString([],{weekday:"long",day:"numeric",month:"long"})}
load();tick();setInterval(tick,10000);setInterval(load,600000);
// Ask the browser to keep the screen awake (not every TV browser supports this).
(function(){try{if(!("wakeLock" in navigator))return;const lock=()=>navigator.wakeLock.request("screen").catch(()=>{});lock();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")lock()})}catch(e){}})();
</script>
</body>
</html>
